# prisma@7.10.0 (CLI tooling) pins mysql2@3.15.3, which is affected by
# GHSA-3f6p-5ww8-9rcr (high, <3.22.0) and GHSA-rgwj-5xj2-c3m3 (moderate,
# <=3.23.0). Drop this override once a Prisma release depends on
# mysql2 >=3.23.1.
overrides:
  'mysql2@<3.23.1': 3.24.5

strictPeerDependencies: false

# GHSA-ggr8-5vv4-36mx: stack-exhaustion (DoS) in deepmerge-ts <8.0.0, pulled in
# transitively by @prisma/config. Only reachable via Prisma's build-time config
# merge, never a runtime request path with attacker-controlled recursive input,
# so it's not exploitable here. Prisma pins deepmerge-ts@7; drop this entry once a
# Prisma release moves to >=8.0.0.
audit:
  ignore:
    - GHSA-ggr8-5vv4-36mx

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  prisma: true
