overrides:
  '@angular-devkit/core>ajv': 8.18.0
  '@angular-devkit/core>picomatch': 4.0.4
  '@nestjs/swagger>js-yaml': 5.4.1
  '@redocly/openapi-core>js-yaml': 4.3.2
  'brace-expansion@>=1.0.0 <1.1.21': 1.1.21
  'brace-expansion@>=2.0.0 <2.1.7': 2.1.7
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  'fastify@>=5.0.0 <5.12.5': 5.12.5
  'js-yaml@>=3.0.0 <3.15.2': 3.15.2
  'mysql2@<3.23.1': 3.23.1
  'undici@>=8.0.0 <8.10.2': 8.10.2
  find-my-way: 9.7.0
  nanoid: 3.3.18

publicHoistPattern:
  - '*@heroui/*'

strictPeerDependencies: false
confirmModulesPurge: false

# GHSA-ggr8-5vv4-36mx: stack-exhaustion (DoS) in deepmerge-ts <8.0.0, pulled in
# transitively by @prisma/config. Only reachable via Prisma's build-time config
# merge, never a runtime request path with attacker-controlled recursive input,
# so it's not exploitable here. Prisma pins deepmerge-ts@7; drop this entry once a
# Prisma release moves to >=8.0.0.
auditConfig:
  ignoreGhsas:
    - GHSA-ggr8-5vv4-36mx

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  prisma: true
  sharp: true
  unrs-resolver: true
